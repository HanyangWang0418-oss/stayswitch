# SWE-bench Verified pilot baseline: always Qwen3.6-35B-A3B (candidate cheaper-but-stronger weak model).
[run]
id = "swe_mid"

[policy]
kind = "fixed"
model = "mid"

[budget]
per_session_usd = 3.0   # runaway loops end here; same rule for every policy
total_usd = 500.0       # raised to 500 on 2026-10-02 (user); the ledger sums every runs/*/calls.jsonl

[prices]
path = "prices.toml"

[log]
path = "../runs/swe_mid/calls.jsonl"
