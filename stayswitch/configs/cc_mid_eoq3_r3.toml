# Claude Code on the mid model (docs/CLIFF_ALIGNMENT.md). Compaction, if any, by the official CliffCompaction proxy via scripts/run_cliff.sh.
[run]
id = "cc_mid_eoq3_r3"

[policy]
kind = "fixed"
model = "mid"

[budget]
per_session_usd = 3.0   # runaway loops end here; same rule for every policy
total_usd = 500.0       # raised to 500 on 2026-10-02 (user); the ledger sums every runs/*/calls.jsonl

[prices]
path = "prices.toml"

[log]
path = "../runs/cc_mid_eoq3_r3/calls.jsonl"
