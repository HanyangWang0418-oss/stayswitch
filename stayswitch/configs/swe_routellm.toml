# SWE-bench Verified pilot: swe_routellm
[run]
id = "swe_routellm"

[policy]
kind = "routellm"   # B3: RouteLLM BERT router applied per step
weak = "weak"
strong = "strong"
threshold = 0.5061   # median strong-win-rate over 861 prompts from swe_strong trajectories (~50% strong calls)

[budget]
per_session_usd = 3.0
total_usd = 300.0       # raised from 245 to 300 on 2026-10-01 (user); the ledger sums every runs/*/calls.jsonl

[prices]
path = "prices.toml"

[log]
path = "../runs/swe_routellm/calls.jsonl"
