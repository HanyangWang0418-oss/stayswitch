# Claude Code on the mid model; compaction by the official CliffCompaction proxy (scripts/run_cliff.sh, AGENT=cc).
[run]
id = "cc_smoke_cliff"

[policy]
kind = "fixed"
model = "mid"

[budget]
per_session_usd = 3.0   # runaway loops end here; same rule for every policy
total_usd = 300.0       # raised from 245 to 300 on 2026-10-01 (user); the ledger sums every runs/*/calls.jsonl

[prices]
path = "prices.toml"

[log]
path = "../runs/cc_smoke_cliff/calls.jsonl"
