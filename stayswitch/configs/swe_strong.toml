# SWE-bench Verified pilot baseline: always the strong model. Source traces for forks.
[run]
id = "swe_strong"

[policy]
kind = "fixed"
model = "strong"

[budget]
per_session_usd = 3.0   # runaway loops end here; same rule for every policy
total_usd = 500.0       # raised to 500 on 2026-10-02 (user); the ledger sums every runs/*/calls.jsonl

[prices]
path = "prices.toml"

[log]
path = "../runs/swe_strong/calls.jsonl"
