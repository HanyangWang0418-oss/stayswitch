# Terminal-Bench 2 (long-horizon) with Claude Code, mid model: native. 12 tasks (configs/tb2_tasks_all.txt).
[run]
id = "cc_tb2_native"

[policy]
kind = "fixed"
model = "mid"

[budget]
per_session_usd = 3.0   # runaway loops end here; same rule for every policy
total_usd = 700.0

[prices]
path = "prices.toml"

[log]
path = "../runs/cc_tb2_native/calls.jsonl"
