# SWE-bench Verified pilot baseline: always strong; compaction by the official CliffCompaction proxy (see scripts/run_cliff.sh).
[run]
id = "swe_cliff32"

[policy]
kind = "fixed"
model = "strong"

[budget]
per_session_usd = 3.0   # runaway loops end here; same rule for every policy
total_usd = 700.0       # raised to 700 on 2026-10-02 (user); the ledger sums every runs/*/calls.jsonl

[prices]
path = "prices.toml"

[log]
path = "../runs/swe_cliff32/calls.jsonl"
